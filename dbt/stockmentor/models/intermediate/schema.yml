version: 2

models:
  - name: int_company_metrics
    description: "Company fundamentals with growth/margin/return ratios normalized to percentage scale."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ticker
              - snapshot_date
    columns:
      - name: ticker
        data_tests:
          - not_null
      - name: sector
        data_tests:
          - not_null
      - name: return_on_equity_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -500
                max_value: 500
              config:
                severity: warn
      - name: profit_margin_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -500
                max_value: 500
              config:
                severity: warn

  - name: int_financials_pivot
    description: "SEC EDGAR financial statement line items pivoted from long to wide format per ticker/fiscal year."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ticker
              - fiscal_year
    columns:
      - name: ticker
        data_tests:
          - not_null
      - name: fiscal_year
        data_tests:
          - not_null
